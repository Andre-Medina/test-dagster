[workspace]
channels = ["conda-forge"]
name = "test-dagster"
platforms = ["osx-arm64"]

[dependencies]
python = "3.12.*"
dagster = ">=1.13.30,<1.14"           # mirrors packages/forecasting-pipeline in the vision repo
dagster-webserver = ">=1.13.30,<1.14"
matplotlib-base = "*"
numpy = "*"
plotly = "*"
polars = "*"

[tasks]
dev = "DAGSTER_HOME=$PWD/.dagster_home PYTHONPATH=$PWD/src dagster dev -m test_dagster.definitions"
materialize = "DAGSTER_HOME=$PWD/.dagster_home PYTHONPATH=$PWD/src python scripts/run_partitions.py"
query = "PYTHONPATH=$PWD/src python scripts/query_check_metadata.py"
